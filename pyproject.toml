[project]
name = "duckwalk"
version = "0.1.0"
description = "A local-first AI companion that notices when a developer is stuck and gets them outside to think out loud."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "temporalio",
    "tabpfn",
    "torch",  # listed directly so uv takes it from the CPU-only index below
    "sentry-sdk",
    "pandas",
    "httpx",
    "astral",
    "piper-tts",
    "scikit-learn",
    "sounddevice",
    "silero-vad",
    "matplotlib",
]

[project.scripts]
dw = "duckwalk.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["duckwalk"]

# This machine has no CUDA GPU, so use CPU-only PyTorch (pulled in by tabpfn).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
